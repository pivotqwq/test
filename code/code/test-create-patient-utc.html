<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTC时间测试 - 创建患者</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        .form-section {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .form-row {
            margin: 10px 0;
        }
        label {
            display: inline-block;
            width: 120px;
            font-weight: bold;
        }
        input, select, textarea {
            width: 200px;
            padding: 5px;
            margin-left: 10px;
        }
        button {
            margin: 10px 5px;
            padding: 10px 20px;
            cursor: pointer;
        }
        .submit-btn {
            background-color: #007bff;
            color: white;
            border: none;
        }
        .clear-btn {
            background-color: #6c757d;
            color: white;
            border: none;
        }
        .result-box {
            margin-top: 20px;
            padding: 10px;
            background-color: #f5f5f5;
            border-radius: 5px;
            white-space: pre-wrap;
            font-family: monospace;
            max-height: 400px;
            overflow-y: auto;
        }
        .datetime-info {
            background-color: #e7f3ff;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
        }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>UTC时间处理测试 - 创建患者</h1>
    
    <div class="form-section">
        <h2>时间信息调试</h2>
        <div class="datetime-info">
            <div><strong>当前本地时间:</strong> <span id="localTime"></span></div>
            <div><strong>当前UTC时间:</strong> <span id="utcTime"></span></div>
            <div><strong>时区偏移:</strong> <span id="timezoneOffset"></span></div>
        </div>
    </div>
    
    <div class="form-section">
        <h2>患者信息表单</h2>
        <form id="patientForm">
            <div class="form-row">
                <label for="name">姓名 *:</label>
                <input type="text" id="name" name="name" required placeholder="请输入姓名">
            </div>
            
            <div class="form-row">
                <label for="gender">性别 *:</label>
                <select id="gender" name="gender" required>
                    <option value="">请选择</option>
                    <option value="M">男</option>
                    <option value="F">女</option>
                </select>
            </div>
            
            <div class="form-row">
                <label for="birth_date">出生日期 *:</label>
                <input type="date" id="birth_date" name="birth_date" required>
                <div style="margin-left: 130px; font-size: 12px; color: #666;">
                    格式: YYYY-MM-DD (将以UTC时间保存)
                </div>
            </div>
            
            <div class="form-row">
                <label for="residence_type">居住类型 *:</label>
                <select id="residence_type" name="residence_type" required>
                    <option value="">请选择</option>
                    <option value="1">城市</option>
                    <option value="2">城镇</option>
                    <option value="3">农村</option>
                </select>
            </div>
            
            <div class="form-row">
                <label for="phone">联系电话:</label>
                <input type="tel" id="phone" name="phone" placeholder="请输入手机号码">
            </div>
            
            <div class="form-row">
                <label for="allergy_history">过敏史:</label>
                <textarea id="allergy_history" name="allergy_history" rows="3" placeholder="请输入过敏史，如无请填写'无'"></textarea>
            </div>
            
            <div class="form-row">
                <button type="button" class="submit-btn" onclick="createPatient()">创建患者</button>
                <button type="button" class="clear-btn" onclick="clearForm()">清空表单</button>
                <button type="button" onclick="fillTestData()">填入测试数据</button>
            </div>
        </form>
    </div>

    <div class="form-section">
        <h2>请求和响应信息</h2>
        <div id="result" class="result-box">等待提交表单...</div>
    </div>

    <script>
        function updateTimeInfo() {
            const now = new Date();
            document.getElementById('localTime').textContent = now.toLocaleString();
            document.getElementById('utcTime').textContent = now.toISOString();
            document.getElementById('timezoneOffset').textContent = `UTC${now.getTimezoneOffset() > 0 ? '-' : '+'}${Math.abs(now.getTimezoneOffset() / 60)}`;
        }

        function calculateAge(birthDate) {
            if (!birthDate) return null;
            const today = new Date();
            const birth = new Date(birthDate);
            let age = today.getFullYear() - birth.getFullYear();
            const monthDiff = today.getMonth() - birth.getMonth();
            
            if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birth.getDate())) {
                age--;
            }
            
            return age;
        }

        function fillTestData() {
            document.getElementById('name').value = 'UTC测试患者';
            document.getElementById('gender').value = 'M';
            document.getElementById('birth_date').value = '2020-01-01';
            document.getElementById('residence_type').value = '1';
            document.getElementById('phone').value = '13800138000';
            document.getElementById('allergy_history').value = '无';
        }

        function clearForm() {
            document.getElementById('patientForm').reset();
            document.getElementById('result').textContent = '等待提交表单...';
        }

        async function createPatient() {
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = '正在创建患者...';
            
            try {
                // 收集表单数据
                const formData = {
                    name: document.getElementById('name').value.trim(),
                    gender: document.getElementById('gender').value,
                    birth_date: document.getElementById('birth_date').value,
                    residence_type: document.getElementById('residence_type').value,
                    phone: document.getElementById('phone').value.trim(),
                    allergy_history: document.getElementById('allergy_history').value.trim() || '无'
                };

                // 计算年龄
                if (formData.birth_date) {
                    formData.age_at_diagnosi = calculateAge(formData.birth_date);
                }

                // 验证必填字段
                const requiredFields = ['name', 'gender', 'birth_date', 'residence_type'];
                const missingFields = requiredFields.filter(field => !formData[field]);
                
                if (missingFields.length > 0) {
                    resultDiv.innerHTML = `❌ 错误：以下字段为必填项：${missingFields.join(', ')}`;
                    return;
                }

                // 显示将要发送的数据（包含时间信息）
                const debugInfo = {
                    formData: formData,
                    birthDateInfo: {
                        originalValue: document.getElementById('birth_date').value,
                        jsDate: new Date(formData.birth_date),
                        isoString: new Date(formData.birth_date).toISOString(),
                        utcDate: new Date(formData.birth_date + 'T00:00:00.000Z').toISOString()
                    }
                };

                console.log('时间调试信息:', debugInfo);

                // 发送POST请求
                const response = await fetch('http://localhost:5000/api/PatientBasicInfo', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();

                // 显示详细信息
                const logInfo = {
                    requestUrl: 'http://localhost:5000/api/PatientBasicInfo',
                    requestMethod: 'POST',
                    requestData: formData,
                    debugInfo: debugInfo,
                    responseStatus: response.status,
                    responseStatusText: response.statusText,
                    responseData: result
                };

                resultDiv.innerHTML = JSON.stringify(logInfo, null, 2);

                if (response.ok) {
                    resultDiv.innerHTML += '\n\n✅ 患者创建成功！';
                    // 清空表单
                    document.getElementById('patientForm').reset();
                } else {
                    resultDiv.innerHTML += `\n\n❌ 创建失败：${result.message || '未知错误'}`;
                }

            } catch (error) {
                console.error('请求失败:', error);
                resultDiv.innerHTML = `❌ 请求失败: ${error.message}`;
            }
        }

        // 页面加载时更新时间信息和填入测试数据
        window.onload = function() {
            updateTimeInfo();
            setInterval(updateTimeInfo, 1000); // 每秒更新时间
            fillTestData();
        };
    </script>
</body>
</html>
